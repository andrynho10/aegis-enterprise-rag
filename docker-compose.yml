version: "3.9"

services:
  aegis-rag-api:
    build: .
    container_name: aegis-rag-enterprise
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - IDP_MODE=mock_ad
      - VECTOR_STORE_BACKEND=chromadb
      - OLLAMA_BASE_URL=http://ollama-local:11434
    volumes:
      - ./storage:/app/storage
    depends_on:
      - chromadb
      - ollama-local

  chromadb:
    image: chromadb/chroma:0.5.15
    container_name: aegis-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  ollama-local:
    image: ollama/ollama:latest
    container_name: aegis-ollama-onprem
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  chroma_data:
  ollama_models:
